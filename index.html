<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MovieSpot: encontre filmes, veja detalhes, elenco e trailers e monte sua lista de favoritos. Dados fornecidos pelo TMDB." />
    <meta name="theme-color" content="#0b0f17" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MovieSpot</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura para evitar "piscar" de cores.
      try {
        var prefs = JSON.parse(localStorage.getItem('moviespot:preferences') || '{}')
        var theme = prefs.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = theme
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <noscript>O MovieSpot precisa de JavaScript habilitado para funcionar.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
